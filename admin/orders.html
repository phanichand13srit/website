    <!-- Main Orders Viewport -->
    <main class="main-viewport">
      
      <div class="page-top-header">
        <div class="page-title-row">
          <h1>Orders</h1>
        </div>

        <div class="page-action-buttons">
          <button class="btn-pill">Export</button>
          <button class="btn-pill btn-pill-primary">Create order</button>
        </div>
      </div>

      <div class="data-card">
        
        <div class="card-filter-bar">
          <span class="tab-all-pill">All</span>
          <div class="table-search-input-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Search and filter orders">
          </div>
        </div>

        <div class="table-scroll-container">
          <table class="shopify-table">
            <thead>
              <tr>
                <th style="width: 36px;"><input type="checkbox" class="custom-checkbox"></th>
                <th>Order</th>
                <th>Date</th>
                <th>Customer</th>
                <th>Channel</th>
                <th>Total</th>
                <th>Payment status</th>
                <th>Fulfillment status</th>
                <th>Items</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>

        <div class="table-pagination-footer">
          <span>1-50</span>
          <button class="pagination-btn">&lt;</button>
          <button class="pagination-btn">&gt;</button>
        </div>

      </div>

    </main>

  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/orders';
    const tbody = document.querySelector('.shopify-table tbody');

    async function fetchOrders() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        tbody.innerHTML = ''; // Clear hardcoded rows

        if (!data.success || data.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 20px;">No orders found.</td></tr>';
          return;
        }

        data.data.forEach(order => {
          const date = new Date(order.createdAt).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          const customerName = order.customerId ? `${order.customerId.firstName || ''} ${order.customerId.lastName || ''}`.trim() : 'Guest';
          const total = `₹${order.total.toFixed(2)}`;
          
          let paymentBadge = '';
          if (order.paymentStatus === 'paid') paymentBadge = '<span class="status-pill active">Paid</span>';
          else if (order.paymentStatus === 'pending') paymentBadge = '<span class="status-pill draft">Pending</span>';
          else paymentBadge = `<span class="status-pill archived">${order.paymentStatus}</span>`;

          let fulfillmentBadge = '';
          if (order.fulfillmentStatus === 'fulfilled') fulfillmentBadge = '<span class="status-pill active">Fulfilled</span>';
          else fulfillmentBadge = '<span class="status-pill draft">Unfulfilled</span>';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><input type="checkbox" class="custom-checkbox"></td>
            <td><strong>#${order.orderNumber}</strong></td>
            <td>${date}</td>
            <td><strong>${customerName || 'Unknown Customer'}</strong></td>
            <td>Online Store</td>
            <td><strong>${total}</strong></td>
            <td>${paymentBadge}</td>
            <td>${fulfillmentBadge}</td>
            <td>-</td>
            <td style="text-align:right;"><button class="btn-pill" onclick="alert('Order view coming soon')">View</button></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Error fetching orders:', err);
      }
    }

    fetchOrders();

    // Filter
    const searchInput = document.querySelector('.table-search-input-box input');
    if (searchInput && tbody) {
      searchInput.addEventListener('input', function(e) {
        const q = e.target.value.toLowerCase();
        const rows = tbody.querySelectorAll('tr');
        rows.forEach(r => {
          r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
      });
    }
  </script>
