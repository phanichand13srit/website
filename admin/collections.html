<head>

<body>

        </svg>

    <!-- Center Search -->

          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

        <span class="kbd-shortcut">CTRL K</span>

    </div>

    <!-- Right Profile -->
    <div class="topbar-right">

        <span>View as</span>
      </button>

      <button class="notification-btn" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="notification-dot"></span>
      </button>

      <div class="store-profile-dropdown">
        <div class="store-avatar">AF</div>
        <span class="store-name-text">Arshith Fresh</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       2. APP LAYOUT (SIDEBAR + MAIN COLLECTIONS TABLE)
       ========================================================================= -->
  <div class="app-container">

    <!-- Left Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">
          <div class="menu-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span>Home</span>
          </div>
        </a>

        <a href="orders.html" class="menu-item">
          <div class="menu-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span>Orders</span>
          </div>
          <span class="badge-count">114</span>
        </a>

        <a href="products.html" class="menu-item active">
          <div class="menu-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 9.4 7.55 4.24a1.78 1.78 0 0 0-2.5 1.55v12.42a1.78 1.78 0 0 0 2.5 1.55L16.5 14.6a1.78 1.78 0 0 0 0-3.2z"></path></svg>
            <span>Products</span>
          </div>
        </a>

        <div class="submenu-list">
          <a href="collections.html" class="submenu-item active">Collections</a>
          <a href="inventory.html" class="submenu-item">Inventory</a>
          <a href="#" class="submenu-item">Purchase orders</a>
          <a href="#" class="submenu-item">Transfers</a>
          <a href="#" class="submenu-item">Gift cards</a>
        </div>

        <a href="customers.html" class="menu-item">
          <div class="menu-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
            <span>Customers</span>
          </div>
        </a>

        <a href="#" class="menu-item">
          <div class="menu-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
            <span>Analytics</span>
          </div>
        </a>
      </div>

      <div class="sidebar-bottom">
        <a href="#" class="menu-item">
          <div class="menu-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span>Settings</span>
          </div>
        </a>
      </div>
    </aside>

    <!-- =======================================================================
         3. MAIN COLLECTIONS VIEWPORT (MATCHING EXACT VIDEO SCREEN)
         ======================================================================= -->
    <main class="main-viewport">
      
      <!-- Top Action Bar -->
      <div class="page-top-header">
        <div class="page-title-row">
          <h1>Collections</h1>
        </div>

        <div class="page-action-buttons">
          <button class="btn-pill btn-pill-primary">Add collection</button>
        </div>
      </div>

      <!-- Main Data Card -->
      <div class="data-card">
        
        <!-- Filter Tabs & Search Bar -->
        <div class="card-filter-bar">
          <span class="tab-all-pill">All</span>
          
          <div class="table-search-input-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Search and filter">
          </div>
        </div>

        <!-- Collections Table matching Video -->
        <div class="table-scroll-container">
          <table class="shopify-table">
            <thead>
              <tr>
                <th style="width: 36px;"><input type="checkbox" class="custom-checkbox"></th>
                <th>Title</th>
                <th>Products</th>
                <th>Conditions</th>
              </tr>
            </thead>
            <tbody id="collectionsTableBody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const tbody = document.getElementById('collectionsTableBody');
    const searchInput = document.getElementById('collectionSearchInput');

    async function fetchCollections() {
      try {
        const res = await fetch('http://localhost:5000/api/collections');
        const json = await res.json();
        const collections = json.data || json;
        
        tbody.innerHTML = '';
        if (!collections || collections.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">No collections found.</td></tr>';
          return;
        }

        collections.forEach(col => {
          const tr = document.createElement('tr');
          tr.dataset.id = col._id;
          tr.style.cursor = 'pointer';

          const imgUrl = col.image || 'https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=80&auto=format&fit=crop&q=60';
          
          tr.innerHTML = `
            <td><input type="checkbox" class="custom-checkbox"></td>
            <td>
              <div class="table-product-item">
                <img src="${imgUrl}" class="table-product-thumb" alt="${col.title}">
                <span class="table-product-name">${col.title}</span>
              </div>
            </td>
            <td><strong>${col.products ? col.products.length : 0}</strong></td>
            <td style="color: var(--text-secondary);">${col.condition || '-'}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Error fetching collections:', err);
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">Failed to load collections.</td></tr>';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchCollections);

    // Row Click to Open Details
    tbody.addEventListener('click', function(e) {
      if (e.target.type === 'checkbox' || e.target.classList.contains('custom-checkbox')) return;
      
      const tr = e.target.closest('tr');
      if (tr && tr.dataset.id) {
        window.location.href = `collection-detail.html?id=${tr.dataset.id}`;
      }
    });

    if (searchInput) {
      searchInput.addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase();
        const rows = tbody.querySelectorAll('tr');
        rows.forEach(row => {
          const text = row.textContent.toLowerCase();
          row.style.display = text.includes(term) ? '' : 'none';
        });
      });
    }
  </script>
</body>
</html>
