<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Arshith Fresh</title>
  
  <!-- Link to the shared admin design system stylesheet -->
  <link rel="stylesheet" href="../assets/css/admin.css">
  <!-- Google Fonts: Inter for clean, modern dashboard typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-page-body">

  <!-- =========================================================================
       ADMIN LOGIN CONTAINER
       A centered, elevated glass card containing branding, form inputs,
       and validation warning messages.
       ========================================================================= -->
  <main class="login-card">
    
    <!-- Brand Logo and Header -->
    <header class="login-brand-header">
      <div class="login-brand-logo">🌱</div>
      <h1>Arshith Fresh</h1>
      <p>Admin Control Portal</p>
    </header>

    <!-- Error Alert Box (Hidden by default, shown by JavaScript if validation fails) -->
    <div id="errorBanner" class="error-banner" role="alert" aria-live="polite">
      <!-- Dynamic error message injected via JavaScript -->
    </div>

    <!-- Login Form -->
    <form id="adminLoginForm" novalidate>
      
      <!-- Email Input Field -->
      <div class="form-group">
        <label for="adminEmail" class="form-label">Admin Email Address</label>
        <input 
          type="email" 
          id="adminEmail" 
          name="email" 
          class="form-control" 
          placeholder="admin@arshithfresh.com" 
          autocomplete="username"
          required
        >
      </div>

      <!-- Password Input Field -->
      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <input 
          type="password" 
          id="adminPassword" 
          name="password" 
          class="form-control" 
          placeholder="••••••••••••" 
          autocomplete="current-password"
          required
        >
      </div>

      <!-- Submit Button -->
      <div class="form-group" style="margin-top: 24px; margin-bottom: 0;">
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
          <span>Sign In to Dashboard</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="M12 5l7 7-7 7"></path>
          </svg>
        </button>
      </div>

    </form>

    <!-- Demo helper hint for the developer -->
    <footer style="margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted);">
      <p>🔒 <em>Demo mode: Enter any email & password to test sign in.</em></p>
    </footer>

  </main>

  <!-- =========================================================================
       VANILLA JAVASCRIPT: FORM VALIDATION & REDIRECTION
       Explaining step-by-step for fresh developers:
       1. Select DOM elements using document.getElementById
       2. Listen for the 'submit' event on the form
       3. Prevent the default browser page reload (event.preventDefault)
       4. Perform client-side checks (trimming whitespace, checking empty inputs)
       5. Redirect to admin-dashboard.html upon success
       ========================================================================= -->
  <script>
    // 1. Grab references to the HTML elements
    const loginForm = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('adminEmail');
    const passwordInput = document.getElementById('adminPassword');
    const errorBanner = document.getElementById('errorBanner');

    // 2. Add an event listener for form submission
    loginForm.addEventListener('submit', function(event) {
      // Prevent browser's default reload behavior
      event.preventDefault();

      // Read values and remove unwanted whitespace with .trim()
      const emailValue = emailInput.value.trim();
      const passwordValue = passwordInput.value.trim();

      // 3. Client-Side Validation: Check if fields are empty
      if (!emailValue && !passwordValue) {
        showError('Please enter both your email address and password.');
        emailInput.focus();
        return;
      }

      if (!emailValue) {
        showError('Please enter your email address.');
        emailInput.focus();
        return;
      }

      // Basic regex check for standard email format (user@domain.ext)
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(emailValue)) {
        showError('Please enter a valid email address.');
        emailInput.focus();
        return;
      }

      if (!passwordValue) {
        showError('Please enter your password.');
        passwordInput.focus();
        return;
      }

      if (passwordValue.length < 4) {
        showError('Password must be at least 4 characters long.');
        passwordInput.focus();
        return;
      }

      // 4. If all validations pass:
      hideError();

      // In a real backend setup, we will send a POST request with JWT here.
      // For now, save fake session indicator to localStorage and redirect:
      localStorage.setItem('arshith_admin_logged_in', 'true');
      localStorage.setItem('arshith_admin_email', emailValue);

      // Redirect to Admin Dashboard page
      window.location.href = 'dashboard.html';
    });

    // Helper function: Display error message banner
    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.style.display = 'block';
    }

    // Helper function: Hide error banner
    function hideError() {
      errorBanner.textContent = '';
      errorBanner.style.display = 'none';
    }
  </script>

</body>
</html>
