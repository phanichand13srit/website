<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management - Arshith Fresh Admin</title>
  
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .stock-input {
      width: 80px;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      text-align: center;
    }
    .stock-input:focus {
      border-color: #2c6ecb;
      outline: none;
    }
    .stock-input-low {
      border-color: #f59e0b;
      background-color: #fffbeb;
      color: #b45309;
    }
    .stock-input-out {
      border-color: #ef4444;
      background-color: #fef2f2;
      color: #b91c1c;
    }
    .category-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .category-chip:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .category-chip.active {
      background: #0f7139;
      color: #ffffff;
      border-color: #0f7139;
      box-shadow: 0 2px 6px rgba(15, 113, 57, 0.25);
    }
  </style>
</head>
<body>

  <!-- Global Header -->
  <header class="global-topbar">
    <div class="topbar-left">
      <div class="shopify-logo">
        <svg viewBox="0 0 109.5 124.5"><path d="M74.7 14.1c-.2 0-.4.1-.5.1-.2-.8-.6-1.5-1.1-2.2-2.1-2.9-5.7-4.4-10.7-4.4-1.2 0-2.5.1-3.7.4-4.8 1.1-9.4 3.9-13.6 8.3-3 3.1-6.1 7.6-7.8 11.2-.8 1.7-1.5 3.3-2.1 4.7l-15.6 4.8c-4.8 1.5-5 1.9-5.6 6.9L.1 113.1c-.5 4.3 2.5 8 6.8 8.4.4 0 .9 0 1.3-.1l74-15.3c4.5-.9 7.7-4.9 7.4-9.5l-14.9-82.5z"/></svg>
        <span>admin</span>
      </div>
    </div>

    <div class="topbar-center">
      <div class="search-box-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="global-search-input" placeholder="Search inventory or products...">
        <span class="kbd-shortcut">CTRL K</span>
      </div>
    </div>

    <div class="topbar-right">
      <a href="../index.html" target="_blank" class="btn-view-as" style="text-decoration:none; color:inherit;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span>View Store</span>
      </a>
      <div class="store-profile-dropdown">
        <div class="store-avatar">AF</div>
        <span class="store-name-text">Arshith Fresh</span>
      </div>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-container">
    <aside class="app-sidebar">
      <div class="sidebar-menu">
        <a href="dashboard.html" class="menu-item"><div class="menu-item-left"><i class="fa-solid fa-house"></i><span>Dashboard</span></div></a>
        <a href="orders.html" class="menu-item"><div class="menu-item-left"><i class="fa-solid fa-bag-shopping"></i><span>Orders</span></div></a>
        <a href="products.html" class="menu-item active"><div class="menu-item-left"><i class="fa-solid fa-tag"></i><span>Products</span></div></a>
        <div class="submenu-list">
          <a href="collections.html" class="submenu-item">Collections / Categories</a>
          <a href="inventory.html" class="submenu-item active">Inventory</a>
        </div>
        <a href="customers.html" class="menu-item"><div class="menu-item-left"><i class="fa-solid fa-users"></i><span>Customers</span></div></a>
        <a href="discounts.html" class="menu-item"><div class="menu-item-left"><i class="fa-solid fa-percent"></i><span>Discounts</span></div></a>
        <a href="reviews.html" class="menu-item"><div class="menu-item-left"><i class="fa-solid fa-star"></i><span>Reviews</span></div></a>
      </div>
    </aside>

    <main class="main-viewport">
      <div class="page-top-header">
        <div class="page-title-row">
          <h1>Inventory Management</h1>
        </div>
        <div class="page-action-buttons">
          <button class="btn-pill" onclick="fetchInventory()"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>
      </div>

      <div class="data-card">
        <div class="card-filter-bar" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px;">
          <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1;">
            
            <!-- Search Input -->
            <div class="table-search-input-box" style="max-width: 320px; min-width: 220px; margin: 0;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="inventorySearch" placeholder="Search product name or subcategory...">
            </div>

            <!-- Filter by Category Dropdown -->
            <div style="display: flex; align-items: center; gap: 6px;">
              <label for="categoryFilter" style="font-size: 12.5px; font-weight: 600; color: #334155; white-space: nowrap;"><i class="fa-solid fa-filter" style="color: #0f7139;"></i> Category:</label>
              <select id="categoryFilter" style="height: 36px; padding: 4px 12px; font-size: 13px; font-weight: 500; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; color: #1e293b; outline: none; cursor: pointer; min-width: 170px;">
                <option value="all">All Categories</option>
              </select>
            </div>

            <!-- Filter by Stock Status -->
            <div style="display: flex; align-items: center; gap: 6px;">
              <label for="stockFilter" style="font-size: 12.5px; font-weight: 600; color: #334155; white-space: nowrap;">Stock:</label>
              <select id="stockFilter" style="height: 36px; padding: 4px 10px; font-size: 13px; font-weight: 500; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; color: #1e293b; outline: none; cursor: pointer; min-width: 130px;">
                <option value="all">All Stock Status</option>
                <option value="in_stock">In Stock (&gt;0)</option>
                <option value="out_of_stock">Out of Stock (0)</option>
              </select>
            </div>

          </div>

          <div id="filterCountBadge" style="font-size: 12.5px; font-weight: 600; color: #64748b; white-space: nowrap;">
            Showing 0 products
          </div>
        </div>

        <!-- Quick Category Filter Chips Bar -->
        <div id="categoryChipsBar" style="display: flex; gap: 8px; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid #edf2f7; overflow-x: auto; flex-wrap: wrap; align-items: center;">
          <!-- Dynamically populated category chips -->
        </div>

        <!-- Sticky / Floating Bulk Actions Toolbar -->
        <div id="bulkActionsBar" class="bulk-actions-bar">
          <div class="bulk-selection-info">
            <span class="bulk-selection-badge"><i class="fa-solid fa-check"></i> <span id="bulkSelectedCount">0</span> selected</span>
          </div>
          <div class="bulk-action-buttons">
            <button type="button" class="btn-bulk-action btn-bulk-primary" onclick="bulkSetStockPrompt()"><i class="fa-solid fa-cubes"></i> Set Stock Quantity</button>
            <button type="button" class="btn-bulk-action" onclick="bulkAddStock(10)"><i class="fa-solid fa-plus"></i> +10 Stock</button>
            <button type="button" class="btn-bulk-action" onclick="bulkSetStockZero()"><i class="fa-solid fa-ban"></i> Mark Out of Stock (0)</button>
            <button type="button" class="btn-bulk-action" onclick="exportInventoryCSV()"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
            <button type="button" class="btn-bulk-action btn-bulk-danger" onclick="bulkDeleteInventoryProducts()"><i class="fa-solid fa-trash"></i> Delete Selected</button>
            <button type="button" class="btn-bulk-close" onclick="deselectAll()" title="Deselect All"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>

        <div class="table-scroll-container">
          <table class="shopify-table">
            <thead>
              <tr>
                <th style="width: 36px;"><input type="checkbox" class="custom-checkbox" id="selectAllCheckbox" title="Select All"></th>
                <th>Product</th>
                <th>Category</th>
                <th>Unit</th>
                <th>Price</th>
                <th>Available Quantity</th>
                <th>Status</th>
                <th style="text-align:right;">Save Quantity</th>
              </tr>
            </thead>
            <tbody id="inventoryTbody">
              <tr><td colspan="8" style="text-align: center; padding: 25px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading inventory from database...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/admin-bulk.js"></script>
  <script>
    const API_BASE = 'http://localhost:5000/api';
    const tbody = document.getElementById('inventoryTbody');
    const searchInput = document.getElementById('inventorySearch');
    const categorySelect = document.getElementById('categoryFilter');
    const stockSelect = document.getElementById('stockFilter');
    const chipsBar = document.getElementById('categoryChipsBar');
    const countBadge = document.getElementById('filterCountBadge');
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const bulkBar = document.getElementById('bulkActionsBar');
    const bulkCountSpan = document.getElementById('bulkSelectedCount');

    let allProducts = [];
    let allCategories = [];
    let activeCategory = 'all';

    async function fetchInventory() {
      try {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 25px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading inventory from database...</td></tr>';
        
        const [prodRes, catRes] = await Promise.all([
          fetch(`${API_BASE}/products`),
          fetch(`${API_BASE}/collections`)
        ]);

        if (prodRes.ok) {
          allProducts = await prodRes.json();
        }
        if (catRes.ok) {
          allCategories = await catRes.json();
        }

        populateCategoryFilters();
        applyFilters();
      } catch (err) {
        console.error('Error loading inventory:', err);
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px; color: #ef4444;">Failed to load inventory from server.</td></tr>';
      }
    }

    function populateCategoryFilters() {
      if (!categorySelect) return;
      categorySelect.innerHTML = '<option value="all">All Categories</option>';
      
      const distinctCats = new Set();
      if (Array.isArray(allCategories)) {
        allCategories.forEach(c => {
          if (c.title) distinctCats.add(c.title);
          if (c.name) distinctCats.add(c.name);
        });
      }
      if (Array.isArray(allProducts)) {
        allProducts.forEach(p => {
          if (p.category) distinctCats.add(p.category);
        });
      }

      distinctCats.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
      });

      renderCategoryChips(Array.from(distinctCats));
    }

    function renderCategoryChips(categories) {
      if (!chipsBar) return;
      chipsBar.innerHTML = '';

      const allChip = document.createElement('button');
      allChip.type = 'button';
      allChip.className = `category-chip ${activeCategory === 'all' ? 'active' : ''}`;
      allChip.innerHTML = `All (${allProducts.length})`;
      allChip.onclick = () => selectCategory('all');
      chipsBar.appendChild(allChip);

      categories.forEach(cat => {
        const count = allProducts.filter(p => p.category && p.category.toLowerCase() === cat.toLowerCase()).length;
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = `category-chip ${activeCategory.toLowerCase() === cat.toLowerCase() ? 'active' : ''}`;
        chip.innerHTML = `${cat} (${count})`;
        chip.onclick = () => selectCategory(cat);
        chipsBar.appendChild(chip);
      });
    }

    function selectCategory(cat) {
      activeCategory = cat;
      if (categorySelect) categorySelect.value = cat;
      
      if (chipsBar) {
        chipsBar.querySelectorAll('.category-chip').forEach(chip => {
          if ((cat === 'all' && chip.textContent.startsWith('All')) || chip.textContent.toLowerCase().startsWith(cat.toLowerCase())) {
            chip.classList.add('active');
          } else {
            chip.classList.remove('active');
          }
        });
      }
      applyFilters();
    }

    function applyFilters() {
      const q = (searchInput ? searchInput.value : '').toLowerCase().trim();
      const stockVal = stockSelect ? stockSelect.value : 'all';

      const filtered = allProducts.filter(p => {
        // Keyword Search
        const name = (p.name || p.title || '').toLowerCase();
        const sub = (p.subcategory || '').toLowerCase();
        const cat = (p.category || '').toLowerCase();
        const matchesQuery = !q || name.includes(q) || sub.includes(q) || cat.includes(q);

        // Category Filter
        const matchesCat = activeCategory === 'all' || cat === activeCategory.toLowerCase();

        // Stock Filter
        const stock = Number(p.countInStock || 0);
        let matchesStock = true;
        if (stockVal === 'in_stock') matchesStock = stock > 0;
        else if (stockVal === 'out_of_stock') matchesStock = stock === 0;

        return matchesQuery && matchesCat && matchesStock;
      });

      if (countBadge) {
        countBadge.textContent = `Showing ${filtered.length} of ${allProducts.length} products`;
      }

      renderInventory(filtered);
      updateSelectionState();
    }

    function renderInventory(products) {
      tbody.innerHTML = '';
      if (!products || products.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 30px; color: #6d7175;"><i class="fa-solid fa-box-open" style="font-size:24px; margin-bottom:8px; display:block; opacity:0.6;"></i>No matching inventory products found.</td></tr>';
        updateSelectionState();
        return;
      }

      products.forEach(p => {
        const title = p.name || p.title || 'Product';
        const stock = Number(p.countInStock !== undefined ? p.countInStock : (p.stock || 0));
        const imgUrl = (p.images && p.images[0] && p.images[0].url) || p.image || 'https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=80';

        let statusBadgeHtml = '';
        let stockInputClass = 'stock-input';
        let rowBgStyle = '';

        if (stock === 0) {
          stockInputClass = 'stock-input stock-input-out';
          statusBadgeHtml = `<span class="status-pill archived" style="background:#fee2e2; color:#991b1b;"><i class="fa-solid fa-circle-xmark"></i> Out of Stock (0)</span>`;
          rowBgStyle = 'background-color: #fff5f5;';
        } else if (stock < 10) {
          stockInputClass = 'stock-input stock-input-low';
          statusBadgeHtml = `<span class="status-pill low-stock"><i class="fa-solid fa-triangle-exclamation"></i> Low Stock (${stock} left)</span>`;
          rowBgStyle = 'background-color: #fff8f8;';
        } else {
          statusBadgeHtml = `<span class="status-pill active"><i class="fa-solid fa-circle-check"></i> In Stock (${stock})</span>`;
        }

        const tr = document.createElement('tr');
        tr.dataset.id = p._id;
        tr.dataset.title = title;
        tr.dataset.category = p.category || 'General';
        tr.dataset.unit = p.unit || '1 unit';
        tr.dataset.price = p.price || 0;
        tr.dataset.stock = stock;
        if (rowBgStyle) tr.style.cssText = rowBgStyle;

        tr.innerHTML = `
          <td><input type="checkbox" class="custom-checkbox row-checkbox" value="${p._id}"></td>
          <td>
            <div class="table-product-item">
              <img src="${imgUrl}" class="table-product-thumb" alt="${title}" onerror="this.src='https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=80';">
              <div>
                <span class="table-product-name" style="font-weight: 600;">${title}</span>
                <div style="font-size: 11.5px; color: #64748b;">${p.subcategory || p.category || ''}</div>
              </div>
            </div>
          </td>
          <td><span style="background:#e8f5e9; color:#0f7139; font-weight:600; padding:2px 8px; border-radius:12px; font-size:12px;">${p.category || 'General'}</span></td>
          <td>${p.unit || '1 kg'}</td>
          <td><strong>₹${p.price || 0}</strong></td>
          <td>
            <input type="number" id="stock_${p._id}" class="${stockInputClass}" value="${stock}" min="0" oninput="handleStockInputColor(this)" style="width:70px; padding:4px 8px; border-radius:6px; font-weight:600;">
          </td>
          <td>
            ${statusBadgeHtml}
          </td>
          <td style="text-align:right;">
            <button class="btn-pill btn-pill-primary" style="padding: 5px 12px; font-size: 12px;" onclick="saveStock('${p._id}')"><i class="fa-solid fa-check"></i> Update</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      attachRowCheckboxListeners();
    }

    // Selection Tracking
    function attachRowCheckboxListeners() {
      const rowCheckboxes = tbody.querySelectorAll('.row-checkbox');
      rowCheckboxes.forEach(cb => {
        cb.addEventListener('change', () => {
          const row = cb.closest('tr');
          if (cb.checked) {
            row.classList.add('row-selected');
          } else {
            row.classList.remove('row-selected');
          }
          updateSelectionState();
        });
      });
    }

    function getSelectedRows() {
      const selected = [];
      tbody.querySelectorAll('.row-checkbox:checked').forEach(cb => {
        const row = cb.closest('tr');
        selected.push({
          id: cb.value,
          title: row.dataset.title,
          category: row.dataset.category,
          unit: row.dataset.unit,
          price: row.dataset.price,
          stock: row.dataset.stock
        });
      });
      return selected;
    }

    function updateSelectionState() {
      const selected = getSelectedRows();
      const count = selected.length;
      const allCheckboxes = tbody.querySelectorAll('.row-checkbox');

      if (count > 0) {
        bulkCountSpan.textContent = count;
        bulkBar.classList.add('active');
      } else {
        bulkBar.classList.remove('active');
      }

      if (selectAllCheckbox) {
        if (allCheckboxes.length > 0 && count === allCheckboxes.length) {
          selectAllCheckbox.checked = true;
          selectAllCheckbox.indeterminate = false;
        } else if (count > 0) {
          selectAllCheckbox.checked = false;
          selectAllCheckbox.indeterminate = true;
        } else {
          selectAllCheckbox.checked = false;
          selectAllCheckbox.indeterminate = false;
        }
      }
    }

    if (selectAllCheckbox) {
      selectAllCheckbox.addEventListener('change', function() {
        const isChecked = this.checked;
        const allCheckboxes = tbody.querySelectorAll('.row-checkbox');
        allCheckboxes.forEach(cb => {
          cb.checked = isChecked;
          const row = cb.closest('tr');
          if (isChecked) row.classList.add('row-selected');
          else row.classList.remove('row-selected');
        });
        updateSelectionState();
      });
    }

    function deselectAll() {
      if (selectAllCheckbox) {
        selectAllCheckbox.checked = false;
        selectAllCheckbox.indeterminate = false;
      }
      tbody.querySelectorAll('.row-checkbox').forEach(cb => {
        cb.checked = false;
        cb.closest('tr').classList.remove('row-selected');
      });
      updateSelectionState();
    }

    // Bulk Action: Set Stock to exact value
    async function bulkSetStockPrompt() {
      const selected = getSelectedRows();
      if (selected.length === 0) return;

      const qtyStr = prompt(`Enter new stock quantity for ${selected.length} selected product(s):`, '25');
      if (qtyStr === null) return;
      const qty = parseInt(qtyStr, 10);
      if (isNaN(qty) || qty < 0) {
        AdminToast.show('Please enter a valid non-negative number', 'error');
        return;
      }

      const ids = selected.map(p => p.id);
      try {
        const res = await fetch(`${API_BASE}/products/bulk-stock`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'x-admin-dev': 'true' },
          body: JSON.stringify({ ids, quantity: qty, operation: 'set' })
        });

        if (res.ok) {
          AdminToast.show(`Stock set to ${qty} for ${ids.length} product(s)!`, 'success');
          deselectAll();
          fetchInventory();
        } else {
          AdminToast.show('Failed to update stock', 'error');
        }
      } catch (e) {
        AdminToast.show('Error updating stock', 'error');
      }
    }

    // Bulk Action: Add +10 Stock
    async function bulkAddStock(delta = 10) {
      const selected = getSelectedRows();
      if (selected.length === 0) return;

      const ids = selected.map(p => p.id);
      try {
        const res = await fetch(`${API_BASE}/products/bulk-stock`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'x-admin-dev': 'true' },
          body: JSON.stringify({ ids, quantity: delta, operation: 'add' })
        });

        if (res.ok) {
          AdminToast.show(`Added +${delta} stock to ${ids.length} product(s)!`, 'success');
          deselectAll();
          fetchInventory();
        } else {
          AdminToast.show('Failed to add stock', 'error');
        }
      } catch (e) {
        AdminToast.show('Error adding stock', 'error');
      }
    }

    // Bulk Action: Set Stock 0
    async function bulkSetStockZero() {
      const selected = getSelectedRows();
      if (selected.length === 0) return;

      if (!confirm(`Mark ${selected.length} selected product(s) as Out of Stock (0 quantity)?`)) return;

      const ids = selected.map(p => p.id);
      try {
        const res = await fetch(`${API_BASE}/products/bulk-stock`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'x-admin-dev': 'true' },
          body: JSON.stringify({ ids, quantity: 0, operation: 'set' })
        });

        if (res.ok) {
          AdminToast.show(`Marked ${ids.length} product(s) as Out of Stock!`, 'success');
          deselectAll();
          fetchInventory();
        } else {
          AdminToast.show('Failed to update stock', 'error');
        }
      } catch (e) {
        AdminToast.show('Error updating stock', 'error');
      }
    }

    // Bulk Action: Export CSV
    function exportInventoryCSV() {
      const selected = getSelectedRows();
      if (selected.length === 0) return;

      const headers = ['Product ID', 'Product Name', 'Category', 'Unit', 'Price (₹)', 'Available Stock', 'Stock Status'];
      const rows = selected.map(p => {
        const stock = Number(p.stock);
        const status = stock === 0 ? 'Out of Stock' : (stock < 10 ? 'Low Stock' : 'In Stock');
        return [p.id, p.title, p.category, p.unit, p.price, stock, status];
      });
      AdminExport.downloadCSV('inventory_export', headers, rows);
    }

    // Bulk Action: Delete Selected
    async function bulkDeleteInventoryProducts() {
      const selected = getSelectedRows();
      if (selected.length === 0) return;

      if (!confirm(`⚠️ Permanently delete ${selected.length} selected product(s) from store catalog? This action cannot be undone.`)) return;

      const ids = selected.map(p => p.id);
      try {
        const res = await fetch(`${API_BASE}/products/bulk-delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-dev': 'true' },
          body: JSON.stringify({ ids })
        });

        if (res.ok) {
          AdminToast.show(`Successfully deleted ${ids.length} product(s)!`, 'success');
          deselectAll();
          fetchInventory();
        } else {
          AdminToast.show('Failed to delete products', 'error');
        }
      } catch (e) {
        AdminToast.show('Error deleting products', 'error');
      }
    }

    function handleStockInputColor(input) {
      const val = Number(input.value) || 0;
      input.classList.remove('stock-input-low', 'stock-input-out');
      if (val === 0) {
        input.classList.add('stock-input-out');
      } else if (val < 10) {
        input.classList.add('stock-input-low');
      }
    }

    async function saveStock(productId) {
      const input = document.getElementById(`stock_${productId}`);
      if (!input) return;

      const newStock = Number(input.value) || 0;

      try {
        const res = await fetch(`${API_BASE}/products/${productId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'x-admin-dev': 'true' },
          body: JSON.stringify({ countInStock: newStock })
        });

        if (res.ok) {
          AdminToast.show('Stock quantity updated successfully!', 'success');
          fetchInventory();
        } else {
          AdminToast.show('Failed to update stock.', 'error');
        }
      } catch (e) {
        AdminToast.show('Error updating stock: ' + e.message, 'error');
      }
    }

    // Event Listeners
    if (searchInput) searchInput.addEventListener('input', applyFilters);
    if (categorySelect) categorySelect.addEventListener('change', (e) => selectCategory(e.target.value));
    if (stockSelect) stockSelect.addEventListener('change', applyFilters);

    function openImageLightbox(e, src, title) {
      if (e && e.stopPropagation) e.stopPropagation();
      const lightbox = document.getElementById('imgPreviewLightbox');
      const img = document.getElementById('imgPreviewLightboxImg');
      const caption = document.getElementById('imgPreviewLightboxTitle');
      if (!lightbox || !img) return;

      img.src = src;
      caption.textContent = title || 'Product Image Preview';
      lightbox.classList.add('active');
    }

    function closeImageLightbox(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      const lightbox = document.getElementById('imgPreviewLightbox');
      if (lightbox) lightbox.classList.remove('active');
    }

    document.addEventListener('click', function(e) {
      if (e.target && e.target.classList && e.target.classList.contains('table-product-thumb')) {
        e.stopPropagation();
        openImageLightbox(e, e.target.src, e.target.alt || e.target.title || 'Product Image');
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeImageLightbox();
    });

    window.openImageLightbox = openImageLightbox;
    window.closeImageLightbox = closeImageLightbox;
    window.saveStock = saveStock;
    window.selectCategory = selectCategory;
    document.addEventListener('DOMContentLoaded', fetchInventory);
  </script>

  <!-- Universal Image Preview Lightbox Modal -->
  <div id="imgPreviewLightbox" class="img-preview-lightbox" onclick="closeImageLightbox(event)">
    <div class="img-preview-card" onclick="event.stopPropagation()">
      <button type="button" class="img-preview-close-btn" onclick="closeImageLightbox(event)">&times;</button>
      <img id="imgPreviewLightboxImg" src="" alt="Full Preview">
      <div id="imgPreviewLightboxTitle" class="img-preview-title">Product Image</div>
    </div>
  </div>

</body>
</html>
