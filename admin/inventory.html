<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Arshith Fresh Admin</title>
  
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .stock-input {
      width: 80px;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      text-align: center;
    }
    .stock-input:focus {
      border-color: #2c6ecb;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Global Header -->
  <header class="global-topbar">
    <div class="topbar-left">
      <div class="shopify-logo">
        <svg viewBox="0 0 109.5 124.5"><path d="M74.7 14.1c-.2 0-.4.1-.5.1-.2-.8-.6-1.5-1.1-2.2-2.1-2.9-5.7-4.4-10.7-4.4-1.2 0-2.5.1-3.7.4-4.8 1.1-9.4 3.9-13.6 8.3-3 3.1-6.1 7.6-7.8 11.2-.8 1.7-1.5 3.3-2.1 4.7l-15.6 4.8c-4.8 1.5-5 1.9-5.6 6.9L.1 113.1c-.5 4.3 2.5 8 6.8 8.4.4 0 .9 0 1.3-.1l74-15.3c4.5-.9 7.7-4.9 7.4-9.5l-14.9-82.5z"/></svg>
        <span>admin</span>
      </div>
    </div>

    <div class="topbar-center">
      <div class="search-box-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="global-search-input" placeholder="Search inventory or products...">
        <span class="kbd-shortcut">CTRL K</span>
      </div>
    </div>

    <div class="topbar-right">
      <a href="../index.html" target="_blank" class="btn-view-as" style="text-decoration:none; color:inherit;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span>View Store</span>
      </a>
      <div class="store-profile-dropdown">
        <div class="store-avatar">AF</div>
        <span class="store-name-text">Arshith Fresh</span>
      </div>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-container">
    <aside class="app-sidebar">
      <div class="sidebar-menu">
        <a href="dashboard.html" class="menu-item"><div class="menu-item-left"><i class="fa-solid fa-house"></i><span>Dashboard</span></div></a>
        <a href="orders.html" class="menu-item"><div class="menu-item-left"><i class="fa-solid fa-bag-shopping"></i><span>Orders</span></div></a>
        <a href="products.html" class="menu-item active"><div class="menu-item-left"><i class="fa-solid fa-tag"></i><span>Products</span></div></a>
        <div class="submenu-list">
          <a href="collections.html" class="submenu-item">Collections / Categories</a>
          <a href="inventory.html" class="submenu-item active">Inventory</a>
        </div>
        <a href="customers.html" class="menu-item"><div class="menu-item-left"><i class="fa-solid fa-users"></i><span>Customers</span></div></a>
      </div>
    </aside>

    <main class="main-viewport">
      <div class="page-top-header">
        <div class="page-title-row">
          <h1>Inventory Management</h1>
        </div>
        <div class="page-action-buttons">
          <button class="btn-pill" onclick="fetchInventory()"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>
      </div>

      <div class="data-card">
        <div class="card-filter-bar" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px;">
          <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1;">
            
            <!-- Search Input -->
            <div class="table-search-input-box" style="max-width: 320px; min-width: 220px; margin: 0;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="inventorySearch" placeholder="Search product name or subcategory...">
            </div>

            <!-- Filter by Category Dropdown -->
            <div style="display: flex; align-items: center; gap: 6px;">
              <label for="categoryFilter" style="font-size: 12.5px; font-weight: 600; color: #334155; white-space: nowrap;"><i class="fa-solid fa-filter" style="color: #0f7139;"></i> Category:</label>
              <select id="categoryFilter" style="height: 36px; padding: 4px 12px; font-size: 13px; font-weight: 500; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; color: #1e293b; outline: none; cursor: pointer; min-width: 170px;">
                <option value="all">All Categories</option>
              </select>
            </div>

            <!-- Filter by Stock Status -->
            <div style="display: flex; align-items: center; gap: 6px;">
              <label for="stockFilter" style="font-size: 12.5px; font-weight: 600; color: #334155; white-space: nowrap;">Stock:</label>
              <select id="stockFilter" style="height: 36px; padding: 4px 10px; font-size: 13px; font-weight: 500; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; color: #1e293b; outline: none; cursor: pointer; min-width: 130px;">
                <option value="all">All Stock Status</option>
                <option value="in_stock">In Stock (&gt;0)</option>
                <option value="out_of_stock">Out of Stock (0)</option>
              </select>
            </div>

          </div>

          <div id="filterCountBadge" style="font-size: 12.5px; font-weight: 600; color: #64748b; white-space: nowrap;">
            Showing 0 products
          </div>
        </div>

        <!-- Quick Category Filter Chips Bar -->
        <div id="categoryChipsBar" style="display: flex; gap: 8px; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid #edf2f7; overflow-x: auto; flex-wrap: wrap; align-items: center;">
          <!-- Dynamically populated category chips -->
        </div>

        <div class="table-scroll-container">
          <table class="shopify-table">
            <thead>
              <tr>
                <th style="width: 36px;"><input type="checkbox" class="custom-checkbox"></th>
                <th>Product</th>
                <th>Category</th>
                <th>Unit</th>
                <th>Price</th>
                <th>Available Quantity</th>
                <th>Status</th>
                <th style="text-align:right;">Save Quantity</th>
              </tr>
            </thead>
            <tbody id="inventoryTbody">
              <tr><td colspan="8" style="text-align: center; padding: 25px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading inventory from database...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api';
    const tbody = document.getElementById('inventoryTbody');
    const searchInput = document.getElementById('inventorySearch');
    const categorySelect = document.getElementById('categoryFilter');
    const stockSelect = document.getElementById('stockFilter');
    const chipsBar = document.getElementById('categoryChipsBar');
    const countBadge = document.getElementById('filterCountBadge');

    let allProducts = [];
    let allCategories = [];
    let activeCategory = 'all';

    async function fetchInventory() {
      try {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 25px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading inventory...</td></tr>';
        
        const [prodRes, colRes] = await Promise.all([
          fetch(`${API_BASE}/products`),
          fetch(`${API_BASE}/collections`)
        ]);

        if (prodRes.ok) {
          allProducts = await prodRes.json();
        }
        if (colRes.ok) {
          allCategories = await colRes.json();
        }

        initCategoryDropdown();
        updateCategoryChips();
        applyFilters();
      } catch (err) {
        console.error('Error fetching inventory:', err);
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 25px; color: #ef4444;">Failed to load inventory from backend API.</td></tr>';
      }
    }

    function initCategoryDropdown() {
      if (!categorySelect) return;
      categorySelect.innerHTML = '<option value="all">All Categories</option>';
      allCategories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.title;
        opt.textContent = cat.title;
        categorySelect.appendChild(opt);
      });
    }

    function updateCategoryChips() {
      if (!chipsBar) return;
      chipsBar.innerHTML = '';

      // "All" Chip
      const allBtn = document.createElement('button');
      allBtn.style.cssText = getChipStyle(activeCategory === 'all');
      allBtn.innerHTML = `All (${allProducts.length})`;
      allBtn.onclick = () => selectCategory('all');
      chipsBar.appendChild(allBtn);

      // Individual Category Chips
      allCategories.forEach(cat => {
        const count = allProducts.filter(p => p.category && p.category.toLowerCase().trim() === cat.title.toLowerCase().trim()).length;
        const isSelected = activeCategory.toLowerCase().trim() === cat.title.toLowerCase().trim();
        const btn = document.createElement('button');
        btn.style.cssText = getChipStyle(isSelected);
        btn.innerHTML = `${cat.title} <span style="opacity:0.8; font-size:11px;">(${count})</span>`;
        btn.onclick = () => selectCategory(cat.title);
        chipsBar.appendChild(btn);
      });
    }

    function getChipStyle(active) {
      return `
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid ${active ? '#0f7139' : '#cbd5e1'};
        background: ${active ? '#0f7139' : '#ffffff'};
        color: ${active ? '#ffffff' : '#334155'};
        transition: all 0.15s ease;
        white-space: nowrap;
      `;
    }

    function selectCategory(catTitle) {
      activeCategory = catTitle;
      if (categorySelect) categorySelect.value = catTitle;
      updateCategoryChips();
      applyFilters();
    }

    function applyFilters() {
      const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const selectedStock = stockSelect ? stockSelect.value : 'all';

      const filtered = allProducts.filter(p => {
        // Search term matching
        const name = (p.name || '').toLowerCase();
        const cat = (p.category || '').toLowerCase().trim();
        const sub = (p.subcategory || '').toLowerCase();
        const matchesSearch = !searchTerm || name.includes(searchTerm) || cat.includes(searchTerm) || sub.includes(searchTerm);

        // Category filter matching
        const matchesCat = (activeCategory === 'all') || (cat === activeCategory.toLowerCase().trim());

        // Stock status filter
        const stock = Number(p.countInStock) || 0;
        let matchesStock = true;
        if (selectedStock === 'in_stock') matchesStock = stock > 0;
        if (selectedStock === 'out_of_stock') matchesStock = stock <= 0;

        return matchesSearch && matchesCat && matchesStock;
      });

      if (countBadge) {
        countBadge.textContent = `Showing ${filtered.length} of ${allProducts.length} products`;
      }

      renderInventory(filtered);
    }

    function renderInventory(products) {
      tbody.innerHTML = '';
      if (!products || products.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 30px; color: #6d7175;"><i class="fa-solid fa-box-open" style="font-size:24px; margin-bottom:8px; display:block; opacity:0.6;"></i>No products found matching the selected category and filter criteria.</td></tr>';
        return;
      }

      products.forEach(p => {
        const title = p.name || 'Unnamed Product';
        const imgUrl = p.image || 'https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=80';
        const stock = Number(p.countInStock) || 0;
        const inStock = stock > 0;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox" class="custom-checkbox"></td>
          <td>
            <div class="table-product-item">
              <img src="${imgUrl}" class="table-product-thumb" alt="${title}" onerror="this.src='https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=80';">
              <div>
                <span class="table-product-name" style="font-weight: 600;">${title}</span>
                <div style="font-size: 11.5px; color: #64748b;">${p.subcategory || p.category || ''}</div>
              </div>
            </div>
          </td>
          <td><span style="background:#e8f5e9; color:#0f7139; font-weight:600; padding:2px 8px; border-radius:12px; font-size:12px;">${p.category || 'General'}</span></td>
          <td>${p.unit || '1 kg'}</td>
          <td><strong>₹${p.price || 0}</strong></td>
          <td>
            <input type="number" id="stock_${p._id}" class="stock-input" value="${stock}" min="0" style="width:70px; padding:4px 8px; border:1px solid #cbd5e1; border-radius:6px; font-weight:600;">
          </td>
          <td>
            <span class="status-pill ${inStock ? 'active' : 'draft'}">
              ${inStock ? 'In Stock' : 'Out of Stock'}
            </span>
          </td>
          <td style="text-align:right;">
            <button class="btn-pill btn-pill-primary" style="padding: 5px 12px; font-size: 12px;" onclick="saveStock('${p._id}')"><i class="fa-solid fa-check"></i> Update</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function saveStock(productId) {
      const input = document.getElementById(`stock_${productId}`);
      if (!input) return;

      const newStock = Number(input.value) || 0;

      try {
        const res = await fetch(`${API_BASE}/products/${productId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'x-admin-dev': 'true' },
          body: JSON.stringify({ countInStock: newStock })
        });

        if (res.ok) {
          alert('Stock quantity updated successfully!');
          fetchInventory();
        } else {
          alert('Failed to update stock.');
        }
      } catch (e) {
        alert('Error updating stock: ' + e.message);
      }
    }

    // Event Listeners
    if (searchInput) searchInput.addEventListener('input', applyFilters);
    if (categorySelect) categorySelect.addEventListener('change', (e) => selectCategory(e.target.value));
    if (stockSelect) stockSelect.addEventListener('change', applyFilters);

    function openImageLightbox(e, src, title) {
      if (e && e.stopPropagation) e.stopPropagation();
      const lightbox = document.getElementById('imgPreviewLightbox');
      const img = document.getElementById('imgPreviewLightboxImg');
      const caption = document.getElementById('imgPreviewLightboxTitle');
      if (!lightbox || !img) return;

      img.src = src;
      caption.textContent = title || 'Product Image Preview';
      lightbox.classList.add('active');
    }

    function closeImageLightbox(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      const lightbox = document.getElementById('imgPreviewLightbox');
      if (lightbox) lightbox.classList.remove('active');
    }

    document.addEventListener('click', function(e) {
      if (e.target && e.target.classList && e.target.classList.contains('table-product-thumb')) {
        e.stopPropagation();
        openImageLightbox(e, e.target.src, e.target.alt || e.target.title || 'Product Image');
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeImageLightbox();
    });

    window.openImageLightbox = openImageLightbox;
    window.closeImageLightbox = closeImageLightbox;
    window.saveStock = saveStock;
    window.selectCategory = selectCategory;
    document.addEventListener('DOMContentLoaded', fetchInventory);
  </script>

  <!-- Universal Image Preview Lightbox Modal -->
  <div id="imgPreviewLightbox" class="img-preview-lightbox" onclick="closeImageLightbox(event)">
    <div class="img-preview-card" onclick="event.stopPropagation()">
      <button type="button" class="img-preview-close-btn" onclick="closeImageLightbox(event)">&times;</button>
      <img id="imgPreviewLightboxImg" src="" alt="Full Preview">
      <div id="imgPreviewLightboxTitle" class="img-preview-title">Product Image</div>
    </div>
  </div>

</body>
</html>
